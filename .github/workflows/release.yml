name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate (#916): the launcher self-reports env!("CARGO_PKG_VERSION"), so a tag
  # built from a stale Cargo.toml ships a binary that forever sees itself as
  # outdated — an infinite self-update loop that also shadows the CLI-wheel
  # update check. Refuse to build unless Cargo.toml matches the tag exactly.
  verify-version:
    name: Verify Cargo.toml version == tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare Cargo.toml version against tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "tag: ${TAG_VERSION}  Cargo.toml: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "::error::A binary built now would self-report v${CARGO_VERSION} and self-update forever (#916)."
            echo "::error::Bump Cargo.toml (+ Cargo.lock) on main first, then re-tag."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: huitzo-x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: huitzo-aarch64-unknown-linux-musl
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: huitzo-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: huitzo-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: huitzo-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl toolchain for static Linux builds
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-compilation for Linux aarch64
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      # Determine binary name (huitzo on Unix, huitzo.exe on Windows)
      - name: Prepare artifact
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/huitzo.exe ${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/huitzo ${{ matrix.asset }}
            chmod +x ${{ matrix.asset }}
          fi
        shell: bash

      # Generate SHA-256 checksum
      - name: Checksum
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile ${{ matrix.asset }} SHA256 | head -2 | tail -1 > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'cli-v')
    permissions:
      contents: read

    steps:
      - name: Collect SHA256 checksums from release assets
        id: shas
        # TAG flows in via env, not inline ${{ }} interpolation: tag names may
        # contain shell metacharacters, and this job holds TAP_UPDATE_TOKEN.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BASE="https://github.com/Huitzo-Inc/huitzo-launcher/releases/download/${TAG}"

          fetch_sha() {
            curl -sSfL "${BASE}/${1}.sha256" | awk '{print $1}'
          }

          echo "arm_mac=$(fetch_sha huitzo-aarch64-apple-darwin)"              >> "$GITHUB_OUTPUT"
          echo "intel_mac=$(fetch_sha huitzo-x86_64-apple-darwin)"             >> "$GITHUB_OUTPUT"
          echo "arm_linux=$(fetch_sha huitzo-aarch64-unknown-linux-musl)"      >> "$GITHUB_OUTPUT"
          echo "intel_linux=$(fetch_sha huitzo-x86_64-unknown-linux-musl)"     >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"                                               >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: Huitzo-Inc/homebrew-tap
          token: ${{ secrets.TAP_UPDATE_TOKEN }}
          path: tap

      - name: Update formula version and checksums
        env:
          VERSION: ${{ steps.shas.outputs.version }}
          ARM_MAC: ${{ steps.shas.outputs.arm_mac }}
          INTEL_MAC: ${{ steps.shas.outputs.intel_mac }}
          ARM_LINUX: ${{ steps.shas.outputs.arm_linux }}
          INTEL_LINUX: ${{ steps.shas.outputs.intel_linux }}
        run: |
          python3 - <<'EOF'
          import os
          import re

          with open("tap/Formula/huitzo.rb") as f:
              content = f.read()

          version     = os.environ["VERSION"]
          arm_mac     = os.environ["ARM_MAC"]
          intel_mac   = os.environ["INTEL_MAC"]
          arm_linux   = os.environ["ARM_LINUX"]
          intel_linux = os.environ["INTEL_LINUX"]

          content = re.sub(r'version "[^"]+"', f'version "{version}"', content)

          checksums = {
              "aarch64-apple-darwin":       arm_mac,
              "x86_64-apple-darwin":        intel_mac,
              "aarch64-unknown-linux-musl": arm_linux,
              "x86_64-unknown-linux-musl":  intel_linux,
          }
          for platform, sha in checksums.items():
              content = re.sub(
                  rf'(url "[^"]*{re.escape(platform)}[^"]*"\n(\s+))sha256 "[^"]+"',
                  rf'\1sha256 "{sha}"',
                  content,
              )

          with open("tap/Formula/huitzo.rb", "w") as f:
              f.write(content)

          print(f"Formula updated to v{version}")
          EOF

      - name: Commit and open PR
        # VERSION/TAG flow in via env, not inline ${{ }}: tag-derived values
        # may contain shell metacharacters and this step holds the tap PAT.
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="auto/bump-huitzo-${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/huitzo.rb
          git commit -m "chore: bump huitzo launcher to v${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump huitzo launcher to v${VERSION}" \
            --body "Automated formula update triggered by https://github.com/Huitzo-Inc/huitzo-launcher/releases/tag/${TAG}" \
            --base main \
            --head "$BRANCH"

          # Merge immediately: the tap has no CI of its own and an unmerged
          # bump means brew silently serves a stale launcher (this happened
          # for v0.2.8/v0.2.9). The checksums above were fetched from the
          # just-published release assets, so the PR content is already
          # verified; a human review adds nothing but drift.
          if ! gh pr merge "$BRANCH" --repo Huitzo-Inc/homebrew-tap --squash --delete-branch; then
            # Fail LOUDLY: an unmerged bump is exactly the silent-drift bug
            # this step exists to kill (v0.2.8/v0.2.9). The release assets are
            # already published, so failing here rolls nothing back — it just
            # makes the tap-sync gap unmissable.
            echo "::error::Tap bump PR could not be auto-merged — brew will serve a stale launcher until it is merged manually"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
          VERSION: ${{ steps.shas.outputs.version }}
          TAG: ${{ github.ref_name }}
