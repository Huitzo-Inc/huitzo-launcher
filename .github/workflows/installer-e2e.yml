# Installer end-to-end matrix (M6 / T9).
#
# Why this file exists: nine blockers reached users in one sprint because CI
# never ran an installer. `ci.yml` builds the launcher and asks it for
# `--launcher-version` — a question the binary answers without touching Python,
# the network, or a wheel. No job here had ever reached a working CLI, and no
# job had ever fetched a URL we print in the README.
#
# So every job below asserts an OUTCOME a user would notice:
#   * the success cases run `huitzo --version` and require a `huitzo-cli`
#     version line — the launcher's own version is not evidence of anything;
#   * the failure cases require the exit code, the refusal text, AND the
#     absence of the thing the bug used to leave behind (a stub install, a
#     half-created home).
#
# Two rules hold everywhere in this file:
#   1. Every install runs against a scratch `HUITZO_HOME` with
#      `HUITZO_NO_MODIFY_PATH=1`. Nothing here may touch a real home.
#   2. Every install exercises the launcher built from THIS commit, handed to
#      the real installer through `HUITZO_LAUNCHER_ASSET_URL`. A job that
#      downloaded the published release would test the last release forever and
#      pass on a pull request that broke the launcher.
name: Installer e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installer-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Sandbox, stated once and inherited by every job and every container.
  HUITZO_NO_MODIFY_PATH: "1"
  HUITZO_ASSUME_YES: "1"

jobs:
  # --- B1 -------------------------------------------------------------------
  # `https://huitzo.ai/install.sh` was documented for months and answered 200
  # with the Hub single-page app, so the one-command bootstrap piped HTML into
  # a shell. A status check would not have caught it; the content type is the
  # tell. This job fetches every install URL the repo ships to a human.
  install-urls:
    name: Install URLs serve an installer (B1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch every documented install URL
        run: python3 scripts/check_install_urls.py

  # --- M6 (Linux) + B2 + B3 + B4 + B9/D8 ------------------------------------
  # One `musl` build — the artifact Linux users actually download — exercised
  # against five hosts: the runner itself and four containers. Containers are
  # cheap; a second runner is not.
  linux:
    name: install.sh e2e + Linux container traps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET: huitzo-x86_64-unknown-linux-musl
      # Raising the unauthenticated 60/hour GitHub API allowance: five installs
      # in one job each read the release feed. The launcher only attaches this
      # when the feed host really is api.github.com (see `github_token_for`).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # Built exactly as `release.yml` builds it, so the e2e exercises the
      # artifact shape that ships rather than a convenient local variant.
      - name: Build the launcher from this commit
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage it as an installable asset
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset"
          cp "target/x86_64-unknown-linux-musl/release/huitzo" "$RUNNER_TEMP/asset/$ASSET"
          chmod +x "$RUNNER_TEMP/asset/$ASSET"
          cd "$RUNNER_TEMP/asset"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      # ---- host case: the documented one-command install on the runner ------
      - name: install.sh reaches a working CLI (ubuntu-latest)
        env:
          HUITZO_HOME: ${{ runner.temp }}/home-host
          HUITZO_LAUNCHER_ASSET_URL: file://${{ runner.temp }}/asset/huitzo-x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          echo "sandboxed HUITZO_HOME=$HUITZO_HOME"
          ./install.sh
          "$HUITZO_HOME/bin/huitzo" --version | tee "$RUNNER_TEMP/version.txt"
          # The whole point: a `huitzo-cli` version line, not `--launcher-version`.
          grep -qE '^huitzo-cli [0-9]+\.[0-9]+' "$RUNNER_TEMP/version.txt"

      # ---- B2: a host with no Python at all --------------------------------
      # `ubuntu:22.04` ships no `python3`. Before D1 this dead-ended in "install
      # Python 3.11+ and re-run"; uv provisions one now, and that has to keep
      # being true.
      - name: 'B2 — ubuntu:22.04 with no Python reaches a working CLI'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/asset:/asset:ro" -v "$PWD:/repo:ro" \
            -e HUITZO_HOME=/tmp/huitzo-home \
            -e HUITZO_NO_MODIFY_PATH=1 -e HUITZO_ASSUME_YES=1 \
            -e "GITHUB_TOKEN=$GITHUB_TOKEN" \
            -e "HUITZO_LAUNCHER_ASSET_URL=file:///asset/$ASSET" \
            ubuntu:22.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates >/dev/null
              if command -v python3 >/dev/null; then
                echo "::error::this image was supposed to have no python3"; exit 1
              fi
              sh /repo/install.sh
              "$HUITZO_HOME/bin/huitzo" --version | tee /tmp/version.txt
              grep -qE "^huitzo-cli [0-9]+\.[0-9]+" /tmp/version.txt
            '

      # ---- B3: python3 without the distro venv package ----------------------
      # Debian/Ubuntu split `ensurepip` into `python3.N-venv`, so `python -m
      # venv` fails on a stock `apt install python3`. The launcher builds the
      # environment with `uv venv`, which needs no such package.
      - name: 'B3 — ubuntu:24.04 with python3 but no python3.12-venv reaches a working CLI'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/asset:/asset:ro" -v "$PWD:/repo:ro" \
            -e HUITZO_HOME=/tmp/huitzo-home \
            -e HUITZO_NO_MODIFY_PATH=1 -e HUITZO_ASSUME_YES=1 \
            -e "GITHUB_TOKEN=$GITHUB_TOKEN" \
            -e "HUITZO_LAUNCHER_ASSET_URL=file:///asset/$ASSET" \
            ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates python3 >/dev/null
              python3 -V
              # Positive proof the trap is armed: `python -m venv` must fail here.
              if python3 -m venv /tmp/proof >/dev/null 2>&1; then
                echo "::error::python3-venv is present — this case is no longer testing B3"; exit 1
              fi
              echo "confirmed: python -m venv fails on this host"
              sh /repo/install.sh
              "$HUITZO_HOME/bin/huitzo" --version | tee /tmp/version.txt
              grep -qE "^huitzo-cli [0-9]+\.[0-9]+" /tmp/version.txt
            '

      # ---- B4: an interpreter the feed publishes no wheel for ---------------
      # This used to "succeed" by falling back to PyPI, where the name `huitzo`
      # resolved to an unrelated 0.2.0 placeholder. The fallback is gone (T2),
      # so the run must FAIL — and, critically, must leave nothing installed.
      - name: 'B4 — ubuntu:22.04 with only python3.11 fails clean and installs no stub'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/asset:/asset:ro" -v "$PWD:/repo:ro" \
            -e HUITZO_HOME=/tmp/huitzo-home \
            -e HUITZO_NO_MODIFY_PATH=1 -e HUITZO_ASSUME_YES=1 \
            -e "GITHUB_TOKEN=$GITHUB_TOKEN" \
            -e "HUITZO_LAUNCHER_ASSET_URL=file:///asset/$ASSET" \
            ubuntu:22.04 bash -euo pipefail -c '
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl ca-certificates python3.11 >/dev/null
              ls /usr/bin/python3*
              sh /repo/install.sh > /tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }

              rc=0
              "$HUITZO_HOME/bin/huitzo" --version > /tmp/run.log 2>&1 || rc=$?
              cat /tmp/run.log
              echo "exit code: $rc"

              [ "$rc" -eq 78 ] || { echo "::error::expected EX_CONFIG (78), got $rc"; exit 1; }
              # The message has to name the interpreter AND what the feed does
              # carry — "no wheel" on its own is not actionable.
              grep -q "Interpreter:   Python 3.11" /tmp/run.log
              grep -q "linux-x86_64-cp312" /tmp/run.log
              grep -q "linux-x86_64-cp313" /tmp/run.log
              # And #B4 itself: nothing may have been installed into the venv.
              # The venv must exist — the failure happened at the wheel, after
              # the environment was built — so "no venv" is not a pass either.
              [ -x "$HUITZO_HOME/venv/bin/python" ] || {
                echo "::error::no managed venv at $HUITZO_HOME/venv — cannot prove the stub is absent"; exit 1; }
              if "$HUITZO_HOME/venv/bin/python" -m pip show huitzo > /tmp/pip.log 2>&1; then
                echo "::error::a huitzo package was installed despite the failure — the stub is back"
                cat /tmp/pip.log
                exit 1
              fi
              cat /tmp/pip.log
              grep -q "not found: huitzo" /tmp/pip.log
            '

      # ---- B9 / D8: musl is refused before anything is written --------------
      - name: 'B9/D8 — alpine:3.20 refuses early and creates no home'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/asset:/asset:ro" -v "$PWD:/repo:ro" \
            -e HUITZO_HOME=/tmp/huitzo-home \
            -e HUITZO_NO_MODIFY_PATH=1 -e HUITZO_ASSUME_YES=1 \
            -e "HUITZO_LAUNCHER_ASSET_URL=file:///asset/$ASSET" \
            alpine:3.20 sh -c '
              set -eu
              apk add --no-cache curl >/dev/null
              rc=0
              sh /repo/install.sh > /tmp/out.log 2>&1 || rc=$?
              cat /tmp/out.log
              echo "exit code: $rc"

              [ "$rc" -ne 0 ] || { echo "::error::alpine install must not succeed"; exit 1; }
              grep -q "does not support musl-based Linux" /tmp/out.log
              grep -q "Required: glibc" /tmp/out.log
              # "Nothing was installed" has to be literally true (D8).
              if [ -e "$HUITZO_HOME" ]; then
                echo "::error::$HUITZO_HOME exists after a refusal"
                ls -la "$HUITZO_HOME"
                exit 1
              fi
              echo "confirmed: $HUITZO_HOME was never created"
            '

      - name: Remove the scratch home
        if: always()
        run: rm -rf "$RUNNER_TEMP/home-host"

  # --- M6 (macOS, Apple Silicon) --------------------------------------------
  macos:
    name: install.sh e2e (macos-14, Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ASSET: huitzo-aarch64-apple-darwin
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the launcher from this commit
        run: cargo build --release

      - name: Stage it as an installable asset
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset"
          cp target/release/huitzo "$RUNNER_TEMP/asset/$ASSET"
          chmod +x "$RUNNER_TEMP/asset/$ASSET"
          cd "$RUNNER_TEMP/asset"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: install.sh reaches a working CLI
        env:
          HUITZO_HOME: ${{ runner.temp }}/home-host
          HUITZO_LAUNCHER_ASSET_URL: file://${{ runner.temp }}/asset/huitzo-aarch64-apple-darwin
        run: |
          set -euo pipefail
          echo "sandboxed HUITZO_HOME=$HUITZO_HOME"
          ./install.sh
          "$HUITZO_HOME/bin/huitzo" --version | tee "$RUNNER_TEMP/version.txt"
          grep -qE '^huitzo-cli [0-9]+\.[0-9]+' "$RUNNER_TEMP/version.txt"

      - name: Remove the scratch home
        if: always()
        run: rm -rf "$RUNNER_TEMP/home-host"

  # --- M6 (Windows) + B7 -----------------------------------------------------
  # One build, two hosts: the stock runner, and the same runner with every
  # directory containing a `python.exe` cut out of PATH so only the `py`
  # launcher is discoverable (B7).
  windows:
    name: install.ps1 e2e (windows-latest, incl. py-launcher-only B7)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      ASSET: huitzo-x86_64-pc-windows-msvc.exe
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the launcher from this commit
        run: cargo build --release

      - name: Stage it as an installable asset
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'asset'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\huitzo.exe (Join-Path $dir $env:ASSET)
          $hash = (Get-FileHash -Path (Join-Path $dir $env:ASSET) -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path (Join-Path $dir "$env:ASSET.sha256") -Value $hash -NoNewline
          Write-Host "staged $env:ASSET  sha256=$hash"

      # `shell: powershell` — Windows PowerShell 5.1, not pwsh 7 — on purpose.
      # It is what install.ps1 documents ("PowerShell 5.1+"), what the default
      # Windows terminal runs, and therefore what the documented
      # `iwr -useb ... | iex` one-liner is actually executed by. It is also the
      # stricter host: 5.1 is where `Invoke-WebRequest`'s `.Content` is a
      # `Byte[]`, the bug that once downgraded checksum verification to a
      # warning. (pwsh 7's HttpClient additionally has no `file` scheme, so the
      # local-asset override cannot run there; the shipped https path behaves
      # identically on both.)
      - name: install.ps1 reaches a working CLI
        shell: powershell
        run: |
          # The runner injects `$ErrorActionPreference = 'stop'`, under which a
          # native command writing to stderr — which the launcher's whole
          # bootstrap progress is — raises a terminating error. Exit codes are
          # the contract here, and they are checked explicitly below.
          $ErrorActionPreference = 'Continue'

          # Sandbox FIRST, in this process, and echoed back as proof.
          $env:HUITZO_HOME = Join-Path $env:RUNNER_TEMP 'home-stock'
          Write-Host "sandboxed HUITZO_HOME=$env:HUITZO_HOME"
          $asset = Join-Path (Join-Path $env:RUNNER_TEMP 'asset') $env:ASSET
          $env:HUITZO_LAUNCHER_ASSET_URL = 'file:///' + ($asset -replace '\\','/')

          .\install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install.ps1 exited $LASTEXITCODE"; exit 1 }

          $version = & (Join-Path $env:HUITZO_HOME 'bin\huitzo.exe') --version 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $version
          if ($rc -ne 0) { Write-Host "::error::huitzo --version exited $rc"; exit 1 }
          if ($version -notmatch 'huitzo-cli \d+\.\d+') {
            Write-Host "::error::no huitzo-cli version line in the output above"; exit 1
          }
          exit 0

      # B7: the launcher used to look for `python.exe` and give up when a host
      # only had the `py` launcher. Hide every `python.exe` on PATH and require
      # the same outcome — whether discovery gets there through `py -0p`, the
      # registry, or a uv-provisioned CPython is the launcher's business; a
      # working CLI is not negotiable.
      - name: 'B7 — install.ps1 reaches a working CLI with python.exe off PATH'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $kept = @()
          foreach ($dir in ($env:PATH -split ';')) {
            if (-not $dir) { continue }
            if (Test-Path (Join-Path $dir 'python.exe')) {
              Write-Host "dropping from PATH: $dir"
              continue
            }
            $kept += $dir
          }
          $env:PATH = $kept -join ';'

          $python = Get-Command python.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($python) {
            Write-Host "::error::python.exe is still resolvable at $($python.Source)"; exit 1
          }
          # The py launcher is what B7 was originally about. If a future runner
          # image drops it, say so loudly and keep the rest of the case (no
          # python.exe on PATH) rather than quietly reporting a green B7.
          $py = Get-Command py.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($py) {
            Write-Host "python.exe: not on PATH.  py launcher: $($py.Source)"
            & $py.Source -0p
          } else {
            Write-Host "::warning::no py launcher on this runner image — this run covers 'no python.exe on PATH' only"
          }

          $env:HUITZO_HOME = Join-Path $env:RUNNER_TEMP 'home-pylauncher'
          Write-Host "sandboxed HUITZO_HOME=$env:HUITZO_HOME"
          $asset = Join-Path (Join-Path $env:RUNNER_TEMP 'asset') $env:ASSET
          $env:HUITZO_LAUNCHER_ASSET_URL = 'file:///' + ($asset -replace '\\','/')

          .\install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install.ps1 exited $LASTEXITCODE"; exit 1 }

          $version = & (Join-Path $env:HUITZO_HOME 'bin\huitzo.exe') --version 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $version
          if ($rc -ne 0) { Write-Host "::error::huitzo --version exited $rc"; exit 1 }
          if ($version -notmatch 'huitzo-cli \d+\.\d+') {
            Write-Host "::error::no huitzo-cli version line in the output above"; exit 1
          }
          exit 0

      - name: Remove the scratch homes
        if: always()
        run: |
          foreach ($name in 'home-stock', 'home-pylauncher') {
            Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP $name) -ErrorAction SilentlyContinue
          }
