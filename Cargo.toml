[package]
name = "huitzo"
version = "0.2.9"
edition = "2024"
rust-version = "1.85"
description = "Huitzo CLI launcher — manages Python environment and execs into huitzo_cli"
license = "Proprietary"
repository = "https://github.com/Huitzo-Inc/huitzo-launcher"

[lib]
name = "huitzo_launcher"
path = "src/lib.rs"

[[bin]]
name = "huitzo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.11"
dirs = "6"
which = "8"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
base64 = "0.22"
url = "2"
tar = "0.4"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
