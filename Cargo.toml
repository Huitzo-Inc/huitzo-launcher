[package]
name = "huitzo"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Huitzo CLI launcher — manages Python environment and execs into huitzo_cli"
license = "Proprietary"
repository = "https://github.com/Huitzo-Inc/huitzo-launcher"

[lib]
name = "huitzo_launcher"
path = "src/lib.rs"

[[bin]]
name = "huitzo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.11"
dirs = "6"
which = "8"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
base64 = "0.22"
url = "2"
tar = "0.4"
zstd = "0.13"
# gzip for the Astral uv release archives (`.tar.gz`); pure-Rust miniz_oxide backend
# (default) so it cross-compiles without a system zlib. huitzo#965 / task #38.
flate2 = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process"] }

# Windows uv release archive is a `.zip`; only needed there. Pure-Rust deflate.
[target.'cfg(windows)'.dependencies]
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
